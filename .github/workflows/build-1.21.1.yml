name: Build 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths:
      - '.github/workflows/build-1.21.1.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'versions/1.21.1/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/build-1.21.1.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'versions/1.21.1/**'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build ReplayMod for 1.21.1
        run: ./gradlew --stacktrace --no-daemon :1.21.1:build

      - name: Upload 1.21.1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replaymod-1.21.1-artifacts
          path: |
            versions/1.21.1/build/libs/*.jar
            versions/1.21.1/build/reports/**
          if-no-files-found: warn
